[package]
name = "contrast-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
invariants = []

[dependencies]

[dev-dependencies]
proptest = "1.12.0"
proptest-state-machine = "0.9.0"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
arithmetic_side_effects = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "deny"
