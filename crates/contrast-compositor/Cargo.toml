[package]
name = "contrast-compositor"
version = "0.1.0"
edition = "2024"
publish = false
description = "Contrast の Smithay シェル（nested プロトタイプ: winit バックエンド）"

[dependencies]
contrast-core = { path = "../contrast-core" }
contrast-policy = { path = "../contrast-policy" }
tracing = "=0.1.44"
# SIGUSR1 でリロードするための signal source。smithay が使う calloop と同じ版の `signals` 機能だけを足す。
calloop = { version = "=0.14.5", default-features = false, features = ["signals"] }

[dependencies.smithay]
version = "=0.7.0"
default-features = false
# backend_session_libseat / backend_udev / backend_drm: DRM バックエンド（列挙）。backend_gbm / backend_egl / renderer_gl: modeset と GLES 描画（フェーズ2）。
features = ["backend_winit", "wayland_frontend", "desktop", "backend_session_libseat", "backend_udev", "backend_drm", "backend_gbm", "backend_egl", "renderer_gl"]
